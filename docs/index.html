<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>stlite app</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js"
    ></script>
    <head>
      <link rel="manifest" href="manifest.json">
    </head>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";
    async function generateFiles() {

      const res = await fetch(
      "https://api.github.com/repos/android-pokoten/godata/git/trees/main?recursive=1"
      );

      const data = await res.json();

      const files = {};

      for (const item of data.tree) {

        // ファイルだけ取得
        if (item.type !== "blob") continue;

        // Python / CSV / JSONだけ読み込む
        if (
          item.path.endsWith(".py") ||
          item.path.endsWith(".csv") ||
          item.path.endsWith(".json")
        ) {

          files[item.path] = {
          url:
          "https://raw.githubusercontent.com/" +
          "android-pokoten/godata/refs/heads/main/" +
          item.path
          };
        }
      }

      return files;
    }

    const files = await generateFiles();
    //console.log(files);
    //console.log(Object.keys(files));

    mount({
      requirements: [
      "pandas",
      "numpy",
      "requests"
      ],
      idbfsMountpoints: ["./data"],
      entrypoint: "web/gbl.py",
      files: files
    });

    </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // 'service-worker.js' を登録 (index.htmlからの相対パス)
        navigator.serviceWorker.register('service-worker.js')
          .then((registration) => {
            console.log('Service Worker registered successfully:', registration.scope);
          })
          .catch((error) => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
</script>

  </body>
</html>
